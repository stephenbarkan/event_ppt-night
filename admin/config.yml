# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: user/repo

media_folder: /assets/uploads
public_folder: /assets/uploads

collections:
  - name: pages
    label: Pages
    icon: draft
    files:
      - name: success
        label: Success page
        file: _data/cms/successPage.json
        fields:
          - { name: title, label: Title }
          - { name: elaboration, label: Elaboration, widget: richtext }
          - { name: ctaText, label: CTA Text }
  - name: posts
    label: Posts
    icon: article
    label_singular: Post
    folder: /content/posts
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Body, name: body, widget: richtext }
      - { label: Download, name: download, widget: file }
